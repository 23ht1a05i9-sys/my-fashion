<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try This Next</title>
<meta name="description" content="A pinboard of small creative things to draw, cook, write, shoot, play and build.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="mark">try-this-next</span>
    <button class="ghost" id="theme" type="button">Dark mode</button>
  </div>

  <header class="hero">
    <h1>Try this <em>next.</em></h1>
    <p class="lede">Small things to draw, cook, write, shoot, play and build. Pick a category or a free hour, save what catches you, and start with the first step.</p>
    <div class="actions">
      <button class="btn" id="surprise" type="button">Surprise me</button>
      <button class="btn alt" id="savedBtn" type="button" aria-pressed="false">Saved (<span id="savedN">0</span>)</button>
    </div>
  </header>

  <section class="tools" aria-label="Find an idea">
    <div class="row">
      <input class="field" id="q" type="search" placeholder="Search ideas, like bread or sunset" aria-label="Search ideas" autocomplete="off">
      <select class="field" id="time" aria-label="How much time do you have">
        <option value="any">Any amount of time</option>
        <option value="s">Under 15 minutes</option>
        <option value="m">15 to 60 minutes</option>
        <option value="l">Over an hour</option>
      </select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Categories"></div>
  </section>

  <p class="count" id="count" aria-live="polite"></p>
  <main class="grid" id="grid"></main>
  <div class="empty" id="empty" hidden>
    <h2 id="emptyTitle">Nothing here yet</h2>
    <p id="emptyText"></p>
  </div>

  <footer>Every idea is a starting point. Change the materials, shrink the time, or ignore the steps.</footer>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet tinted-wrap" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<script src="script.js"></script>
</body>
</html>
